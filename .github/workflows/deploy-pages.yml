name: Deploy Flai-hosted viewer to GitHub Pages

# The live site is this branch. Point clouds stream from Flai's Amazon S3 bucket,
# so the artifact is the static viewer plus a small tile index.
on:
  push:
    branches: [feat/flai-dhmvii-source]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build viewer for the repository subpath
        run: npm run build
        env:
          VITE_BASE_PATH: /DHMVII_potree-next/
          VITE_TILE_INDEX_URL: tile-index/

      # Flai's catalogue API does not allow the github.io origin (CORS), so a
      # static copy of it is published with the site on every deploy.
      - name: Build the tile index from Flai's catalogue
        run: node scripts/build-tile-index.mjs dist/tile-index

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
