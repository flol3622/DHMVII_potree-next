<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffed00" />
    <meta
      name="description"
      content="Every LiDAR point of Flanders, streaming in your browser. The DHMV II open survey as a single COPC file — no install, no download, no desktop GIS."
    />
    <title>Flanders in Points · DHMV II LiDAR viewer</title>

    <link rel="stylesheet" href="/vendor/potree/potree.css" />
    <link rel="stylesheet" href="/vendor/libs/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="/vendor/libs/openlayers3/ol.css" />
    <link rel="stylesheet" href="/vendor/libs/spectrum/spectrum.css" />
    <link rel="stylesheet" href="/vendor/libs/jstree/themes/mixed/style.css" />
  </head>

  <body>
    <div class="potree_container">
      <div id="potree_render_area">
        <button
          id="map-tab-button"
          class="map-tab-button"
          type="button"
          aria-controls="potree_map"
          aria-expanded="false"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m3 5 5-2 8 3 5-2v15l-5 2-8-3-5 2V5Z" />
            <path d="M8 3v15M16 6v15" />
          </svg>
          <span>Map</span>
        </button>

        <section id="potree_map" class="map-panel" aria-label="Map navigation" hidden>
          <header id="potree_map_header" class="map-panel-header">
            <div>
              <span class="map-panel-eyebrow">Position &amp; view</span>
              <strong>Map</strong>
            </div>
            <div class="map-panel-actions">
              <button id="map-frame-view" type="button" title="Frame the current 3D view">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <span>Frame view</span>
              </button>
              <button id="map-close" class="map-close" type="button" aria-label="Close map">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="m6 6 12 12M18 6 6 18" />
                </svg>
              </button>
            </div>
          </header>

          <form id="map-search-form" class="map-search" role="search">
            <label class="sr-only" for="map-search-input">Search for a location in Belgium</label>
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="6" />
              <path d="m16 16 4 4" />
            </svg>
            <input
              id="map-search-input"
              name="address"
              type="search"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="map-search-results"
              aria-expanded="false"
              aria-haspopup="listbox"
              autocomplete="off"
              spellcheck="false"
              placeholder="Place, street or address in Belgium"
              enterkeyhint="search"
            />
            <button id="map-search-submit" type="submit">Go</button>
          </form>

          <div
            id="map-search-results"
            class="map-search-results"
            role="listbox"
            aria-label="Possible locations"
            hidden
          ></div>
          <div class="map-canvas-shell">
            <div id="potree_map_content" class="map-canvas" aria-label="Interactive map"></div>
            <dl class="map-camera-parameters" aria-label="Live camera parameters">
              <div>
                <dt>Scene Z</dt>
                <dd id="map-camera-height">—</dd>
              </div>
              <div>
                <dt>Tilt</dt>
                <dd id="map-camera-tilt">—</dd>
              </div>
              <div>
                <dt>Heading</dt>
                <dd id="map-camera-heading">—</dd>
              </div>
            </dl>
          </div>

          <footer class="map-panel-footer">
            <div class="map-legend" aria-label="Map legend">
              <span><i class="legend-camera"></i>Camera</span>
              <span><i class="legend-footprint"></i>Visible patch</span>
            </div>
            <span id="map-camera-readout">Locating camera…</span>
          </footer>
          <p id="map-status" class="map-status" role="status">
            Click the map to center that location in a north-facing 60° view (maximum scene Z 500 m).
          </p>
        </section>
      </div>
      <div id="potree_sidebar_container"></div>
    </div>

    <template id="project-summary-template">
      <section class="project-summary" aria-label="DHMV stream status">
        <div class="project-wordmark">
          <span class="project-wordmark-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path d="M8 31c8-1 11-11 20-11 5 0 8 3 12 6" />
              <path d="M8 23c7-1 10-8 18-8 6 0 10 3 14 6" />
              <path d="M8 38c9-1 13-11 22-11 4 0 7 2 10 4" />
            </svg>
          </span>
          <span class="project-wordmark-copy">
            <strong>Flanders in Points</strong>
            <span>DHMV II LiDAR · one COPC file</span>
          </span>
        </div>
        <div class="eyebrow">Open data · Digitaal Vlaanderen</div>
        <h1>Every LiDAR point of Flanders</h1>
        <div class="subtitle">
          <span id="status-dot" class="status-dot"></span>
          <span id="status">Reading COPC header…</span>
        </div>
        <div class="metrics-grid">
          <div class="metric"><strong id="visible-points">—</strong><span>Visible points</span></div>
          <div class="metric"><strong id="visible-nodes">—</strong><span>Visible nodes</span></div>
          <div class="metric"><strong id="deepest-level">—</strong><span>Deepest LOD</span></div>
          <div class="metric"><strong id="active-loads">—</strong><span>Active loads</span></div>
        </div>
        <button id="reset-view" class="sidebar-action" type="button">
          <span>Reset crop view</span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m9 6-6 6 6 6M3 12h12a6 6 0 0 0 0-12" />
          </svg>
        </button>
      </section>
    </template>

    <div id="error-card" class="error-card" role="alert">
      <strong>Potree could not load this COPC</strong>
      <pre id="error-message"></pre>
    </div>

    <script src="/vendor/libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="/vendor/libs/spectrum/spectrum.js"></script>
    <script src="/vendor/libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="/vendor/libs/other/BinaryHeap.js"></script>
    <script src="/vendor/libs/tween/tween.min.js"></script>
    <script src="/vendor/libs/d3/d3.js"></script>
    <script src="/vendor/libs/proj4/proj4.js"></script>
    <script src="/vendor/libs/openlayers3/ol.js"></script>
    <script src="/vendor/libs/i18next/i18next.js"></script>
    <script src="/vendor/libs/jstree/jstree.js"></script>
    <script src="/vendor/libs/copc/index.js"></script>
    <script src="/vendor/potree/potree.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
